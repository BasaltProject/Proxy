# Public listener and authentication. The servers behind it are configured in servers.toml.
[network]
# Literal IPv4 or IPv6 bind address. IPv6 dual-stack must be requested explicitly.
bind = "0.0.0.0"
port = 25565
dual-stack = false
# Authenticate Java players with Mojang. Disabling this explicitly permits offline identities.
online-mode = true
# Accept incoming transfer handshakes. Transfers still authenticate normally; cookies do not prove identity.
accept-transfers = false
# Include the player's public IP in the Mojang session check when enabled.
prevent-client-proxy-connections = false
# -1 disables client compression; 0 compresses every packet.
compression-threshold = 256

# Expect a HAProxy PROXY protocol header (v1 or v2) at the start of every connection that comes from an address in
# proxy-protocol-trusted, and take the player's address from it. Turn it on only behind a load balancer or hosting
# panel that sends one. Connections from any other address are treated as ordinary ones and their header is never
# believed, so a player cannot forge an address.
proxy-protocol = false
# The load balancers allowed to send a PROXY header: IP addresses or CIDR ranges, IPv4 or IPv6.
# Must not be empty when proxy-protocol is on.
# proxy-protocol-trusted = ["10.0.0.5", "192.168.0.0/24"]
proxy-protocol-trusted = []

# Milliseconds a player's address must wait between two login attempts (the CraftBukkit connection-throttle,
# which ships as 4000). 0 turns it off. Loopback is never throttled, and neither are server list pings.
# NO VANILLA: vanilla has no throttle.
connection-throttle-ms = 0

# Most connections open at once from one address, pings included. 0 means no limit. NO VANILLA.
max-connections-per-address = 0

# Most players let through the final step of logging in each tick (50 ms); the rest wait for the next one. Paper's
# max-joins-per-tick (which ships as 5). 0 means no limit. NO VANILLA.
max-joins-per-tick = 0

[general]
# Name sent to a player's client as the server brand (the F3 screen) when a server switch rebuilds its
# configuration. Empty sends "Basalt Proxy".
brand = ""

# Console commands to run once the proxy is listening, in order, each time it starts.
# startup-commands = ["list"]
startup-commands = []

# A regular expression (ECMAScript) every player name must match to log in, on top of vanilla's own rule that a
# name has at most 16 characters between "!" and "~". Empty applies only the vanilla rule. NO VANILLA when set.
# username-pattern = "^[A-Za-z0-9_]+$"
username-pattern = ""

# Require signed chat from every player, as vanilla's enforce-secure-profile does, and say so in the server list.
# Only takes effect in online mode: a chat message without a signature then disconnects the player.
enforce-secure-profile = true

[query]
# Answer GameSpy 4 status queries over UDP, as vanilla's enable-query does, only for the server list sites and
# monitoring tools that still speak it. IPv4 only. Off by default.
enabled = false

# UDP port the query listens on, vanilla's query.port. It may share the number of the Java port: one is TCP, the other UDP.
port = 25565

[runtime]
# Session owners and a separate bounded pool for DNS, authentication and other slow work.
io-loops = 2
workers = 4
max-sessions = 4096
max-pending-work = 256
# Global retained network-buffer budget and ceiling for each session.
max-buffered-bytes = 268435456
session-buffer-bytes = 16777216
# Pause reads above high water and resume below low water: low < high < session ceiling.
high-water-bytes = 4194304
low-water-bytes = 2097152
# Monotonic deadlines in milliseconds, bounded to 1..300000.
handshake-timeout-ms = 10000
login-timeout-ms = 30000
connect-timeout-ms = 10000
read-timeout-ms = 30000
write-timeout-ms = 10000
# Check GitHub at startup and warn when a newer release or nightly build is available.
update-checker = true

[admission]
# Token buckets: sustained attempts per second and burst capacity, globally and per origin IP.
global-rate = 200
global-burst = 400
origin-rate = 10
origin-burst = 20
# An origin table at capacity rejects new origins until idle entries expire.
max-origins = 65536
origin-expiry-ms = 60000

[forwarding]
# Identity this proxy signs into basalt-scheme servers, and the private Ed25519 key file.
# The key is generated on first use and its public half is printed for the servers' trusted-keys.
proxy-id = "proxy"
key-file = ".basalt/forwarding.key"

[logging]
# One of: trace, debug, info, warn, error.
level = "info"
# Mirror the console into .basalt/logs/latest.log, archiving the previous run as .basalt/logs/archive/<date>-<n>.log.gz.
file = true
# How many days of archived logs to keep. 0 keeps them forever.
keep-days = 14
# Colour the console output: auto (only on a terminal), always or never.
color = "auto"

[bedrock]
# Bedrock Edition listener (UDP). A Bedrock player joins the first server of the default route as a Java client,
# with chunks, position and chat translated; everything else is not translated yet. Off by default.
enabled = false
port = 19132
# How Bedrock clients reach the proxy. NetherNet is the only transport Bedrock 26.60 and newer use; RakNet stays for
# older clients.
#   "both"       NetherNet and RakNet (recommended)
#   "nethernet"  NetherNet only
#   "raknet"     RakNet only (clients on 26.60 and newer cannot join)
# NetherNet needs TCP on `port` (signaling) and a UDP port of its own, `nethernet-port`.
transport = "both"
# UDP port of NetherNet game traffic. 0 picks `port` when RakNet is off and `port` + 1 when it is on.
nethernet-port = 0
# Address NetherNet tells clients to send game traffic to. Empty means the one the client reached; set the public one
# behind NAT.
advertise-address = ""
# Path to a Minecraft server jar or to an en_us.json language file, used to put into words the translatable messages a
# server sends (join and leave lines, death messages). Empty keeps the raw keys. Nothing is downloaded.
language = ""
# Let a server with forwarding = "basalt" serve Bedrock players itself over the session envelope; the proxy relays. Off by default.
delegate = false

[reload]
# Reload by itself when a file in the config directory or the plugin directory changes, once it has stopped changing.
# A file that does not validate is reported and the running configuration stays. Same as the console `reload` command.
watch-files = false
interval-ms = 2000

[translation]
# auto: capable Basalt Server translates; otherwise Proxy needs a verified route.
# proxy: force translation here. off: require compatible client/server protocols.
mode = "auto"

[access]
# Only let players on the whitelist connect. Who is on it is state, not configuration: it lives in .basalt/players.db and
# is edited with /whitelist add and /whitelist remove. /whitelist on and off move this for the run; a restart follows this file.
whitelist = false
# Kick the players already online who are not on the whitelist whenever it is switched on or a name leaves it.
enforce-whitelist = false
