# Permission groups.
#
# This file says what a group IS. Who belongs to it is player state, so it lives in
# .basalt/players.db and is set with `op`, `deop` or `group`, never by editing this file.
#
# A permission is a dotted name. A trailing `*` matches everything below it, and a
# name prefixed with `-` denies instead of granting. The most specific rule wins, so
# a denial of `basalt.command.stop` beats a grant of `basalt.command.*` regardless of
# the order they are written in.
#
# A permission nobody grants is denied. The console is always allowed everything.
# Plugin commands declared with a permission are checked against these groups too.
#
# The proxy answers a command only for a player who may run it; anything else goes on to the backend, and so does a
# command the backend has under the same name. Every command is also reachable as `basalt:<name>`, which is never
# shadowed by a backend. Give players `basalt.command.list` or `basalt.command.help` only if you want those answered
# by the proxy.

[groups.default]
# The group everyone starts in. Exactly one group must be marked as the default.
default = true
permissions = ["basalt.command.server"]

[groups.operator]
# What `op` assigns. Exactly one group must be marked as the operator group.
operator = true
permissions = ["*"]

# Groups can inherit from another, and add or take away from what they got:
# [groups.moderator]
# inherits = "default"
# permissions = ["basalt.command.kick", "basalt.command.glist", "-basalt.command.server"]
