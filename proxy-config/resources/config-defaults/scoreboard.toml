# The panel down the right-hand side of the screen.
#
# Off by default: it covers part of the view, and a client shows only one sidebar, which a backend usually already
# fills. That is why `[ui] priority` below defaults to "backend".
#
# Profiles work exactly as in server_list.toml: highest priority among those switched on with `active` or whose
# every `when` holds, falling back to the one marked `default`. Text is MiniMessage with the usual %placeholders%,
# animations included, and each entry in `lines` is one row (the client draws at most 15).

enabled = false

# Who draws this when the backend sends its own: "proxy" keeps what this file says and discards the backend's,
# "backend" lets the backend's version through and only draws this one when the backend sends nothing.
[ui]
priority = "backend"

# How often each player's board is redrawn, in ticks (20 = one second).
update-interval-ticks = 20

[profiles.default]
default = true
title = "<bold><gradient:gray:white>BASALT PROXY</gradient></bold>"
lines = [
    "",
    "<gray>Online</gray> <white>%basalt_server_online%/%basalt_server_max_players%</white>",
    "",
    "<gray>%basalt_animation_website%</gray>",
]
