name: Build

on:
  push:
    branches: [main, cpp]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_call:
    inputs:
      version:
        description: The version to stamp; empty derives one from the event
        type: string
        default: ''
      release:
        description: Build only the release targets
        type: boolean
        default: false
      ref:
        description: The commit to build
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Plan the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WANTED: ${{ inputs.version }}
        run: |
          if [ -n "$WANTED" ]; then
              echo "version=$WANTED" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
              .github/scripts/plan-version.sh nightly proxy-runtime/include/basalt/proxy/runtime/BuildInfo.hpp
          else
              .github/scripts/plan-version.sh ci proxy-runtime/include/basalt/proxy/runtime/BuildInfo.hpp
          fi

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
          - os: macos-15
            target: macOS-x64
            arch: x86_64
          - os: macos-15
            target: macOS-arm64
          - os: windows-2025
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.ref }}

      - name: Install the toolchain
        uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 1200M
          key: ${{ matrix.arch && format('{0}-cross', matrix.target) || matrix.target }}

      - name: Restore the x64 libc++
        if: matrix.arch == 'x86_64'
        uses: actions/cache@v4
        with:
          path: ~/llvm-x64
          key: libcxx-x64-${{ hashFiles('.github/scripts/select-compiler.sh') }}

      - name: Select the compiler
        shell: bash
        env:
          BASALT_TARGET_ARCH: ${{ matrix.arch }}
        run: .github/scripts/select-compiler.sh

      - name: Configure
        shell: bash
        run: eval cmake --preset release -DCMAKE_BUILD_TYPE=Release "-DBASALT_VERSION=${{ needs.plan.outputs.version }}" $BASALT_CMAKE_ARGS

      - name: Build
        shell: bash
        run: cmake --build build/release -- -k 0

      - name: Test
        shell: bash
        run: ctest --test-dir build/release --output-on-failure --timeout 300

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: basalt-proxy-${{ matrix.target }}
          path: build/release/bin/

      - name: Check the architecture
        if: matrix.arch == 'x86_64'
        shell: bash
        run: file build/release/bin/* | grep -q x86_64

  sanitize:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 800M
          key: sanitize

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the address and undefined sanitizers
        run: eval cmake --preset asan $BASALT_CMAKE_ARGS

      - name: Build
        run: cmake --build build/asan

      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  portable-poll:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: lukka/get-cmake@latest
      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 800M
          key: portable-poll

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the portable poll readiness backend
        run: eval cmake --preset debug -DBASALT_IO_FORCE_POLL=ON -B build/poll $BASALT_CMAKE_ARGS
      - name: Build
        run: cmake --build build/poll
      - name: Test
        run: ctest --test-dir build/poll --output-on-failure

  thread-sanitize:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: lukka/get-cmake@latest
      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 800M
          key: thread-sanitize

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the thread sanitizer
        run: eval cmake --preset tsan $BASALT_CMAKE_ARGS
      - name: Build
        run: cmake --build build/tsan
      - name: Test
        run: ctest --test-dir build/tsan --output-on-failure

  format:
    if: ${{ !inputs.release }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Check formatting
        run: |
          find proxy-runtime proxy-config proxy-plugins wire/wire-* -name '*.hpp' -o -name '*.cpp' \
            | grep -v third_party \
            | xargs clang-format-19 --dry-run --Werror

  nightly:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: nightly-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: basalt-proxy-*

      - name: Publish the nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release.sh nightly "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" artifacts basalt-proxy
