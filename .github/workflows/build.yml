name: Build

on:
  push:
    branches: [main, cpp]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the toolchain
        uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}

      - name: Configure
        run: cmake --preset release

      - name: Build
        # The run number is the build half of the version: 26.2.<build>.
        run: cmake --build build/release -- -k 0

      - name: Test
        run: ctest --test-dir build/release --output-on-failure

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: basalt-proxy-${{ matrix.os }}
          path: build/release/bin/

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - name: Configure with the address and undefined sanitizers
        run: cmake --preset asan

      - name: Build
        run: cmake --build build/asan

      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check formatting
        run: |
          find proxy-runtime wire/wire-* -name '*.hpp' -o -name '*.cpp' \
            | grep -v third_party \
            | xargs clang-format --dry-run --Werror
