name: Build

on:
  push:
    branches: [main, cpp]
  pull_request:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: Linux-x64
          - os: ubuntu-24.04-arm
            target: Linux-arm64
          - os: macos-15-intel
            target: macOS-x64
          - os: macos-15
            target: macOS-arm64
          - os: windows-2025
            target: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the toolchain
        uses: lukka/get-cmake@latest

      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.target }}

      - name: Select the compiler
        shell: bash
        run: .github/scripts/select-compiler.sh

      - name: Configure
        shell: bash
        run: eval cmake --preset release "-DBASALT_VERSION=26.3.${{ github.run_number }}" $BASALT_CMAKE_ARGS

      - name: Build
        shell: bash
        # The run number is the build half of the version: 26.3.<build>.
        run: cmake --build build/release -- -k 0

      - name: Test
        shell: bash
        run: ctest --test-dir build/release --output-on-failure

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: basalt-proxy-${{ matrix.target }}
          path: build/release/bin/

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: lukka/get-cmake@latest

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the address and undefined sanitizers
        run: eval cmake --preset asan $BASALT_CMAKE_ARGS

      - name: Build
        run: cmake --build build/asan

      - name: Test
        run: ctest --test-dir build/asan --output-on-failure

  portable-poll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: lukka/get-cmake@latest
      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the portable poll readiness backend
        run: eval cmake --preset debug -DBASALT_IO_FORCE_POLL=ON -B build/poll $BASALT_CMAKE_ARGS
      - name: Build
        run: cmake --build build/poll
      - name: Test
        run: ctest --test-dir build/poll --output-on-failure

  thread-sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: lukka/get-cmake@latest
      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Configure with the thread sanitizer
        run: eval cmake --preset tsan $BASALT_CMAKE_ARGS
      - name: Build
        run: cmake --build build/tsan
      - name: Test
        run: ctest --test-dir build/tsan --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select the compiler
        run: .github/scripts/select-compiler.sh

      - name: Check formatting
        run: |
          find proxy-runtime proxy-config proxy-plugins wire/wire-* -name '*.hpp' -o -name '*.cpp' \
            | grep -v third_party \
            | xargs clang-format-19 --dry-run --Werror
