name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Install the toolchain
        uses: lukka/get-cmake@16e8153a8b4918849d92aad131befe67a3705daa # latest
      - name: Install ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1
        with:
          job-summary: ''
          max-size: 1200M
          key: sonar
      - name: Select the compiler
        shell: bash
        run: .github/scripts/select-compiler.sh
      - name: Configure
        shell: bash
        run: eval cmake --preset release -DCMAKE_BUILD_TYPE=Release $BASALT_CMAKE_ARGS
      - name: Build
        run: cmake --build build/release -- -k 0
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
